<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>计数器</title><script src="./support.js"></script></head><body><x-dc><helmet><style>body{margin:0}</style></helmet><main style="width:560px;height:420px;background:#ffffff;color:#0d0d0d;padding:40px;font-family:system-ui,sans-serif;box-sizing:border-box"><p style="margin:0 0 24px;color:#777;font-size:13px">MINE STUDIO</p><h1 style="margin:0 0 24px;font-size:32px">已点击 {{count}} 次</h1><sc-if value="{{on}}" hint-placeholder-val="{{ false }}"><p style="margin:0 0 24px;color:#16a34a;font-size:16px">状态：已开启</p></sc-if><sc-if value="{{off}}" hint-placeholder-val="{{ true }}"><p style="margin:0 0 24px;color:#666;font-size:16px">状态：未开启</p></sc-if><button type="button" onClick="{{toggle}}" style="padding:12px 24px;border:0;border-radius:12px;background:#0d0d0d;color:#ffffff;font-size:16px;cursor:pointer">切换状态</button></main></x-dc><script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":420}}'>class Component extends DCLogic { state = { count: 0, on: false }; renderVals() { return { count: this.state.count, on: this.state.on, off: !this.state.on, toggle: () => this.setState({ count: this.state.count + 1, on: !this.state.on }) }; } }</script></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Pine 官网首页</title>
  <script src="./support.js"></script>
  <link rel="stylesheet" href="ds/pine/tokens.css">
  <link rel="stylesheet" href="ds/pine/components/bundle.css">
  <script src="ds/pine/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body { margin: 0; } .wrap { max-width: 1200px; margin: 0 auto; padding: 0 40px; box-sizing: border-box; } .feature { display: flex; flex-direction: column; gap: 10px; padding: 24px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface-raised); } .feature h3 { margin: 0; font-size: 18px; line-height: 26px; } .feature p { margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-muted); } .ico { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); }</style></helmet>
<div style="background: var(--surface); color: var(--ink); font-family: var(--font-sans);">
  <header class="wrap" style="display: flex; flex-wrap: wrap; align-items: center; gap: 24px; min-height: 72px;">
    <div style="display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600;"><span style="width: 30px; height: 30px; border-radius: 9px; background: {{accent}}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 15px;">P</span>Pine</div>
    <nav style="display: flex; gap: 24px; font-size: 14px; color: var(--ink-muted); flex: 1;"><span>产品</span><span>模板</span><span>价格</span><span>客户案例</span></nav>
    <a href="Login.dc.html" style="font-size: 14px; color: var(--ink); text-decoration: none;">登录</a>
    <a href="Login.dc.html" style="display: inline-flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 10px; background: {{accent}}; color: #ffffff; font-size: 14px; font-weight: 500; text-decoration: none;">免费试用</a>
  </header>
  <section class="wrap" style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px; padding-top: 88px; padding-bottom: 64px;">
    <x-import component-from-global-scope="Pine.Badge" tone="accent" dot="{{yes}}">新版看板已上线</x-import>
    <h1 style="margin: 0; max-width: 760px; font-size: clamp(36px, 6vw, 60px); line-height: 1.12; font-weight: 600; letter-spacing: -1.5px; text-wrap: balance;">让小团队把事做完</h1>
    <p style="margin: 0; max-width: 560px; font-size: 18px; line-height: 30px; color: var(--ink-muted);">需求、讨论和交付放在同一个地方。打开 Pine，每个人都知道今天该做什么。</p>
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;">
      <a href="Login.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 24px; border-radius: 12px; background: {{accent}}; color: #ffffff; font-size: 16px; font-weight: 500; text-decoration: none;">免费试用 14 天</a>
      <a href="Main.dc.html" style="display: inline-flex; align-items: center; height: 48px; padding: 0 24px; border-radius: 12px; border: 1px solid var(--border); color: var(--ink); font-size: 16px; text-decoration: none;">看看产品</a>
    </div>
  </section>
  <section class="wrap" style="padding-bottom: 80px;">
    <div style="border-radius: 24px; padding: 24px; background: linear-gradient(160deg, var(--accent-soft), var(--surface-sunken));">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 16px;">
        <dc-import name="TaskCard" hint-size="264px,124px"></dc-import>
        <dc-import name="TaskCard" task="{{cardB}}" hint-size="264px,124px"></dc-import>
        <dc-import name="TaskCard" task="{{cardC}}" hint-size="264px,124px"></dc-import>
        <dc-import name="TaskCard" task="{{cardD}}" hint-size="264px,124px"></dc-import>
      </div>
    </div>
  </section>
  <section class="wrap" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 20px; padding-bottom: 96px;">
    <div class="feature"><span class="ico"><x-import component-from-global-scope="Pine.Icon" name="grid" size="{{icon}}"></x-import></span><h3>一眼看清进度</h3><p>看板、列表和日历共用同一份数据，切换视图不用重新整理。</p></div>
    <div class="feature"><span class="ico"><x-import component-from-global-scope="Pine.Icon" name="message" size="{{icon}}"></x-import></span><h3>讨论跟着任务走</h3><p>评论、附件和决定都留在任务里，新同事也能看懂来龙去脉。</p></div>
    <div class="feature"><span class="ico"><x-import component-from-global-scope="Pine.Icon" name="sparkles" size="{{icon}}"></x-import></span><h3>每周自动摘要</h3><p>周一早上收到上周的完成情况和本周风险，周会只讨论要决定的事。</p></div>
  </section>
  <section class="wrap" style="padding-bottom: 96px;">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; padding: 40px; border-radius: 24px; background: {{accent}}; color: #ffffff;">
      <div><h2 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600;">今天就开始</h2><p style="margin: 6px 0 0; font-size: 16px; opacity: 0.85;">10 人以内的团队永久免费。</p></div>
      <a href="Login.dc.html" style="display: inline-flex; align-items: center; height: 48px; padding: 0 24px; border-radius: 12px; background: #ffffff; color: {{accent}}; font-size: 16px; font-weight: 600; text-decoration: none;">创建团队空间</a>
    </div>
  </section>
  <footer class="wrap" style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; padding-top: 24px; padding-bottom: 40px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-muted);"><span>© 2026 Pine</span><span>隐私 · 条款 · 联系我们</span></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1360},"accent":{"editor":"color","options":["#2f6f4f","#2563eb","#b45309","#7c3aed"],"default":"#2f6f4f","section":"品牌"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true, icon: 20, accent: this.props.accent ?? '#2f6f4f',
      cardB: { code: 'PINE-1279', tag: '待评审', tone: 'warning', title: '价格页文案评审', due: '明天', comments: 4, owner: '周屿' },
      cardC: { code: 'PINE-1262', tag: '已完成', tone: 'success', title: '用户访谈记录整理', due: '10 月 22 日', comments: 12, owner: '许诺' },
      cardD: { code: 'PINE-1290', tag: '开发', tone: 'info', title: '接入新的 CMS 数据结构', due: '11 月 4 日', comments: 0, owner: '陈一鸣' }
    };
  }
}
</script>
</body>
</html>

name: Validate development

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: dev-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require production metadata before merging main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const pkg=JSON.parse(readFileSync('package.json'));
          assert.notEqual(pkg.private,true,'Dev package must be promoted explicitly');
          assert.match(pkg.version,/^\d+\.\d+\.\d+$/,'main requires a stable version');
          JS
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check:i18n
      - run: npm run test:modules
      - run: npm test

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MineDesign</title><style>/*__STYLES__*/</style></head><body>
<header><span class="brand" aria-label="MineDesign（MDN）"><!--__BRAND__--><strong>MineDesign</strong></span><select id="documents" aria-label="选择设计稿"></select><button id="annotate" aria-pressed="false">批注</button><button id="theme">切换外观</button><span id="status" role="status">正在连接</span></header>
<main><iframe id="editor" title="设计编辑器" sandbox="allow-scripts allow-same-origin allow-downloads allow-modals" allow="clipboard-write"></iframe><aside id="notes"><h2>设计反馈</h2><p class="hint">开启批注后，选择画板中的元素或区域。</p><ol id="annotation-list"></ol><textarea id="message" aria-label="给 Agent 的补充说明" placeholder="给 Agent 的补充说明"></textarea><button id="send">发送到当前聊天</button><button id="copy">复制反馈</button><p id="delivery" role="status"></p><small>本地实验版 · 编辑器基于 BaoCut</small></aside></main>
<dialog id="compose"><form method="dialog"><h2 id="target-label">添加批注</h2><textarea id="comment" aria-label="批注内容" required maxlength="4000"></textarea><footer><button value="cancel" formnovalidate>取消</button><button value="add">添加</button></footer></form></dialog>
<script>window.MINEDESIGN_CONFIG=/*__CONFIG__*/;</script><script type="module">/*__APP__*/</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MineDesign</title><style>/*__STYLES__*/</style></head><body>
<!-- 界面文案在 app.mjs 按当前语言填入：data-i18n 写文字，data-i18n-label 写 aria-label 与 title，data-i18n-aria 只写 aria-label，data-i18n-placeholder 写占位文字 -->
<header class="topbar">
  <button id="about-open" class="brand" type="button" aria-haspopup="dialog" data-i18n-label="about"><!--__BRAND__--><strong>MineDesign</strong></button>
  <div class="menu-wrap"><button id="project" class="btn btn-ghost project" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="project-menu" data-i18n-label="pickProject"><span id="project-name"></span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div id="project-menu" class="menu menu-start" role="menu" data-i18n-aria="pickProject" hidden></div></div>
  <div id="files" class="file-tabs" role="tablist" data-i18n-aria="projectFiles"></div>
  <span class="spacer"></span>
  <button id="annotate" class="btn btn-ghost" type="button" aria-pressed="false" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v6"/><path d="M9 10h6"/></svg><span data-i18n="comment"></span></button>
  <div id="view-controls" class="view-controls" hidden>
    <div class="menu-wrap"><button id="zoom" class="btn btn-ghost zoom" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="zoom-menu" data-i18n-label="zoom"><span id="zoom-readout">100%</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div id="zoom-menu" class="menu" role="menu" data-i18n-aria="zoom" hidden></div></div>
    <div class="menu-wrap"><button id="play" class="btn btn-icon" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="play-menu" data-i18n-label="play"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg></button><div id="play-menu" class="menu" role="menu" data-i18n-aria="play" hidden></div></div>
  </div>
  <button id="panel" class="btn btn-icon" type="button" aria-pressed="true" aria-controls="notes"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg></button>
</header>
<main>
  <section class="viewport" data-i18n-aria="viewport" aria-busy="true">
    <iframe id="editor" data-i18n-label="editorTitle" sandbox="allow-scripts allow-same-origin allow-downloads allow-modals" allow="clipboard-write" hidden></iframe>
    <div id="viewport-state" class="viewport-state" data-state="loading">
      <div class="error-content">
        <div id="state-illustration"></div>
        <div id="state-message" role="status" aria-live="polite"><h2 id="state-title"></h2><p id="state-description"></p></div>
        <button id="retry" class="btn btn-solid btn-pill" type="button" data-i18n="reload" hidden></button>
        <details id="state-details" hidden><summary data-i18n="errorDetails"></summary><pre id="error-detail"></pre></details>
      </div>
    </div>
  </section>
  <aside id="notes" aria-labelledby="notes-title">
    <div class="notes-head"><h2 id="notes-title" data-i18n="feedbackTitle"></h2><span id="count" class="count" hidden></span></div>
    <ol id="annotation-list"></ol>
    <div id="empty" class="empty"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M13 8H7"/><path d="M17 12H7"/></svg><p class="empty-title" data-i18n="noComments"></p><p data-i18n="noCommentsHint"></p></div>
    <div class="composer">
      <textarea id="message" rows="3" data-i18n-aria="messageLabel" data-i18n-placeholder="messagePlaceholder"></textarea>
      <div class="composer-actions">
        <button id="copy" class="btn btn-icon" type="button" data-i18n-label="copyFeedback"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
        <button id="send" class="btn btn-solid" type="button" data-i18n="send" disabled></button>
      </div>
    </div>
    <p id="delivery" class="note" role="status"></p>
  </aside>
</main>
<!-- 评论输入：仿 Codex，在点中的位置旁浮出一行输入框，不遮挡目标；Enter 提交，Esc 取消 -->
<div id="compose" class="comment-composer" role="dialog" hidden>
  <svg class="comment-pin" viewBox="0 0 28 28" aria-hidden="true"><path d="M2 26 2 14A12 12 0 1 1 14 26Z"/></svg>
  <form id="compose-form" class="comment-bar">
    <textarea id="comment" rows="1" maxlength="4000" data-i18n-aria="commentField" data-i18n-placeholder="commentPlaceholder"></textarea>
    <button id="compose-add" class="comment-submit" type="submit" data-i18n-label="add" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></button>
  </form>
</div>
<dialog id="about" class="about" aria-labelledby="about-name">
  <form method="dialog"><button class="close" value="close" data-i18n-aria="close"><!--__CLOSE__--></button></form>
  <header class="about-head">
    <!--__BRAND_ABOUT__-->
    <div><h2 id="about-name">MineDesign</h2><p class="about-tagline" data-i18n="tagline"></p></div>
  </header>
  <section class="about-group" aria-labelledby="about-version-label">
    <div class="about-row">
      <div class="about-pair"><span id="about-version-label" class="about-label" data-i18n="version"></span><span id="about-version" class="about-value"></span></div>
      <button id="about-action" class="btn btn-outline about-action" type="button"></button>
    </div>
    <p id="about-status" class="about-status" role="status"></p>
  </section>
  <section class="about-group">
    <div class="about-row">
      <span id="about-language-label" class="about-label" data-i18n="language"></span>
      <div id="about-language" class="segmented" role="radiogroup" aria-labelledby="about-language-label">
        <button type="button" role="radio" data-language="system" data-i18n="followCodex"></button>
        <button type="button" role="radio" data-language="zh-Hans" lang="zh-CN">中文</button>
        <button type="button" role="radio" data-language="en" lang="en">English</button>
      </div>
    </div>
  </section>
  <section class="about-group" aria-labelledby="about-contact-label">
    <h3 id="about-contact-label" class="about-label" data-i18n="contact"></h3>
    <ul id="about-links" class="about-links"></ul>
  </section>
</dialog>
<script>window.MINEDESIGN_CONFIG=/*__CONFIG__*/;</script><script type="module">/*__APP__*/</script></body></html>
